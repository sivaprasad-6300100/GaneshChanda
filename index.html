<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Ganesh Chanda | Ganesh Chaturthi Donation & Chanda Management
    </title>

    <meta
      name="description"
      content="Ganesh Chanda is a simple and transparent platform to manage Ganesh Chaturthi chanda, donations, expenses, members, and festival activities."
    />

    <meta name="author" content="GaneshChanda" />

    <!-- Search Engine Crawling -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <!-- Replace www.ganeshchanda.in with your actual domain -->
    <link
      rel="canonical"
      href="https://ganeshchanda.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/jpeg"
      href="/favicon.jpg"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Ganesh Chanda | Ganesh Chaturthi Chanda & Donation Management"
    />

    <meta
      property="og:description"
      content="Manage Ganesh Chaturthi chanda, donations, expenses, members, and festival activities with Ganesh Chanda."
    />

    <!-- Replace www.ganeshchanda.in with your actual domain -->
    <meta
      property="og:url"
      content="https://ganeshchanda.in/"
    />

    <!-- Replace with your actual OG image -->
    <meta
      property="og:image"
      content="https://ganeshchanda.in/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Ganesh Chanda - Ganesh Chaturthi Chanda Management"
    />

    <meta
      property="og:site_name"
      content="GaneshChanda"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Ganesh Chanda | Ganesh Chaturthi Chanda Management"
    />

    <meta
      name="twitter:description"
      content="Manage Ganesh Chaturthi chanda, donations, expenses, members, and festival activities."
    />

    <!-- Replace www.ganeshchanda.in with your actual domain -->
    <meta
      name="twitter:image"
      content="https://ganeshchanda.in/og-image.png"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GaneshChanda",
        "url": "https://ganeshchanda.in/",
        "description": "A platform for managing Ganesh Chaturthi chanda, donations, expenses, members, and festival activities.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
